[package]
name = "rofloxbox-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rofloxbox-audio = { version = "0.1.0", path = "../audio" }
rofloxbox-control = { version = "0.1.0", path = "../control" }
rofloxbox-analysis = { version = "0.1.0", path = "../analysis" }
rofloxbox-formats = { version = "0.1.0", path = "../formats" }
rofloxbox-library = { version = "0.1.0", path = "../library" }
eframe = "0.33.3"
egui_extras = "0.33"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
flate2 = "1.1.10"
getrandom = "0.3"
lofty = "0.24.0"

# macOS draws through Metal (wgpu); other systems keep OpenGL.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.33.3", features = ["wgpu"] }
# Where the pointer is while files are dragged in from Finder.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

# rekordbox's library is SQLCipher (encrypted SQLite): bundled, with the
# system's crypto (CommonCrypto on macOS, libcrypto on Linux)...
[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }

# ...and on Windows, which has none SQLCipher can use, OpenSSL built along.
# Ejecting drives without starting another program.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.5"
# Checks the guided tours (build.rs).
toml = "1.1.8"

[lints]
workspace = true
